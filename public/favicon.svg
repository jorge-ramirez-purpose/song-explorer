<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vinyl record outer ring -->
  <circle cx="32" cy="32" r="30" fill="#1a1a1a" stroke="#444" stroke-width="1"/>

  <!-- Multiple groove rings -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#252525" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#252525" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#252525" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#252525" stroke-width="0.8"/>

  <!-- Green center label with subtle gradient effect -->
  <defs>
    <radialGradient id="greenGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1de89b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d296;stop-opacity:1" />
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="11" fill="url(#greenGradient)"/>

  <!-- Center hole -->
  <circle cx="32" cy="32" r="3" fill="#0a0a0a"/>
</svg>
